<!doctype html>
<html lang="$if(lang)$$lang$$else$en$endif$">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$if(is_index)$$sitetitle$$else$$title$ – $sitetitle$$endif$</title>
  <link rel="stylesheet" href="$root$style.css">
  <link rel="alternate" type="application/atom+xml" title="$sitetitle$" href="$root$feed.xml">
$for(header-includes)$
  $header-includes$
$endfor$
</head>
<body>
  <header>
    <nav>
      <a href="$root$index.html">$sitetitle$</a>
      <a href="$root$posts/index.html">Posts</a>
      <a href="$root$feed.html">Feed</a>
    </nav>
  </header>

  <main>
$if(is_index)$
    <h1>$title$</h1>
$else$
    <article>
      <h1>$title$</h1>
$if(date)$
      <p class="meta"><time datetime="$date$">$date$</time>$if(author)$ · $for(author)$$author$$sep$, $endfor$$endif$</p>
$endif$
$if(abstract)$
      <div class="abstract">$abstract$</div>
$endif$
$endif$
$body$
$if(is_index)$
$else$
    </article>
$endif$
  </main>

  <footer>
    <p>© $sitetitle$</p>
  </footer>
</body>
</html>
